version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine patch/minor bumps instead of a flood of
      # single-package PRs — a major bump (Next.js, React, etc.) always
      # gets its own PR regardless, since those need a real look.
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
