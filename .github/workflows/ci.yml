name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, typecheck, lint, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build
        env:
          # Build-time only — no real backend is reachable in CI. Every
          # getPublicEvents()/getEvent() call falls back to local mock
          # data when this points nowhere real (see lib/pulse/endpoints.ts),
          # and isSupabaseConfigured gates every Supabase call the same
          # way, so the build succeeds without live credentials.
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high
